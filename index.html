<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌲 8組樹木成長互動計分板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN for 60 points victory -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #1e3a8a 0%, #065f46 40%, #022c22 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none; /* 防止手機連按時反白文字 */
        }

        /* Ambient floating particles */
        .bg-glow {
            box-shadow: 0 0 50px rgba(52, 211, 153, 0.25);
        }

        /* Tree Swaying Animation */
        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.8)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 25px rgba(250, 204, 21, 1)); transform: scale(1.03); }
        }

        .sway-animation {
            animation: sway 4s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .giant-glow {
            animation: pulse-glow 2.5s infinite ease-in-out, sway 3s ease-in-out infinite;
            transform-origin: bottom center;
        }

        /* Floating Score Text Animation */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }

        .floating-score {
            animation: floatUp 1s ease-out forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col min-h-screen m-0 p-0">

    <!-- Top Navigation & Control Bar (大螢幕與首頁共用) -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-emerald-500/30 sticky top-0 z-50 px-4 py-3" id="main-header">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🌲</span>
                <div>
                    <h1 class="font-extrabold text-xl md:text-2xl text-emerald-400 tracking-wide">活動樹木成長計分板</h1>
                    <p class="text-xs text-slate-300">8組雲端同步連線 (目標 60 分成為參天大樹)</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap" id="header-controls">
                <button onclick="toggleAudio()" id="audio-btn" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition" title="音效">
                    🔊 音效: 開
                </button>
                <button onclick="showResetModal()" id="reset-btn" class="hidden p-2 rounded-xl bg-red-900/40 hover:bg-red-800/60 border border-red-500/30 text-red-200 text-sm font-semibold transition" title="重置分數">
                    🔄 重置所有組別
                </button>
            </div>
        </div>
    </header>

    <!-- 手機遙控器專用精簡 Header -->
    <header class="hidden bg-slate-900/95 backdrop-blur-md border-b border-emerald-500/30 sticky top-0 z-50 px-4 py-3" id="mobile-header">
        <div class="flex items-center justify-between">
            <h1 class="font-extrabold text-xl text-emerald-400" id="mobile-title">📱 專屬遙控器</h1>
            <button onclick="backToRoleSelection()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-sm font-semibold hover:bg-slate-700 transition">
                返回重選
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

        <!-- ========================================== -->
        <!-- VIEW 0: ROLE SELECTION (進入畫面)          -->
        <!-- ========================================== -->
        <section id="role-selection-view" class="w-full flex flex-col items-center justify-center space-y-10 py-10">
            <div class="flex flex-col md:flex-row gap-8 w-full max-w-4xl justify-center items-stretch">
                <!-- 投影大螢幕按鈕 -->
                <button onclick="switchView('projector')" class="flex-1 bg-slate-900/60 border-2 border-emerald-500/50 hover:border-emerald-400 hover:bg-slate-800/80 rounded-3xl p-8 flex flex-col items-center justify-center transition-all transform hover:scale-105 shadow-2xl backdrop-blur-sm group">
                    <span class="text-7xl mb-4 group-hover:animate-bounce">🖥️</span>
                    <span class="text-3xl font-extrabold text-white mb-2">投影大螢幕</span>
                    <span class="text-slate-400 text-sm text-center">放置於會場前方，顯示 8 組最新戰況。</span>
                </button>
                
                <!-- 手機遙控器選擇區 -->
                <div class="flex-1 bg-slate-900/60 border border-blue-500/30 rounded-3xl p-6 flex flex-col items-center shadow-2xl backdrop-blur-sm">
                    <span class="text-4xl mb-2">📱</span>
                    <span class="text-2xl font-bold text-blue-300 mb-2">各組專屬加分器</span>
                    <span class="text-slate-400 text-sm text-center mb-6">請各組點擊自己的號碼進入。</span>
                    
                    <div class="grid grid-cols-4 gap-3 w-full" id="team-select-grid">
                        <!-- JS 產生 8 個按鈕 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- VIEW 1: PROJECTOR MODE (8 TEAMS DISPLAY)   -->
        <!-- ========================================== -->
        <section id="projector-view" class="w-full hidden">
            <!-- Stage Status Banner -->
            <div class="mb-6 bg-emerald-950/60 border border-emerald-500/30 rounded-2xl p-4 flex flex-wrap justify-around items-center gap-2 text-center backdrop-blur-sm">
                <div class="flex items-center gap-2 text-sm md:text-base">
                    <span class="text-2xl">🌰</span>
                    <span class="text-slate-300">0 - 14 分: <strong class="text-amber-400">種子期</strong></span>
                </div>
                <div class="flex items-center gap-2 text-sm md:text-base">
                    <span class="text-2xl">🌱</span>
                    <span class="text-slate-300">15 - 29 分: <strong class="text-emerald-400">發芽期</strong></span>
                </div>
                <div class="flex items-center gap-2 text-sm md:text-base">
                    <span class="text-2xl">🌿</span>
                    <span class="text-slate-300">30 - 44 分: <strong class="text-green-400">幼苗期</strong></span>
                </div>
                <div class="flex items-center gap-2 text-sm md:text-base">
                    <span class="text-2xl">🌳</span>
                    <span class="text-slate-300">45 - 59 分: <strong class="text-teal-300">成長樹</strong></span>
                </div>
                <div class="flex items-center gap-2 text-sm md:text-base">
                    <span class="text-2xl">🌲</span>
                    <span class="text-slate-300">60+ 分: <strong class="text-yellow-300 font-bold">參天大樹 👑</strong></span>
                </div>
            </div>

            <!-- 8 Team Grid -->
            <div id="projector-grid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3 md:gap-4">
                <!-- JS Will Render 8 Team Cards Here -->
            </div>
        </section>

        <!-- ========================================== -->
        <!-- VIEW 2: SINGLE CONTROLLER MODE (MOBILE)    -->
        <!-- ========================================== -->
        <section id="single-controller-view" class="w-full hidden flex-col items-center justify-center max-w-md mx-auto">
             <div id="mobile-team-display" class="w-full">
                <!-- JS 會在這裡渲染單一組別的狀態與按鈕 -->
             </div>
        </section>

    </main>

    <!-- Custom Modal Notification -->
    <div id="toast-modal" class="fixed bottom-6 right-6 md:right-auto md:left-1/2 md:-translate-x-1/2 bg-emerald-600 text-slate-950 font-bold px-5 py-3 rounded-2xl shadow-2xl transition transform translate-y-20 opacity-0 z-50 flex items-center gap-2 pointer-events-none">
        <span id="toast-icon">✨</span>
        <span id="toast-msg">提示訊息</span>
    </div>

    <!-- 確認重置對話框 -->
    <div id="reset-confirm-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] px-4">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <div class="text-5xl mb-4">⚠️</div>
            <h3 class="text-xl font-bold text-white mb-2">確定要歸零所有分數嗎？</h3>
            <p class="text-slate-400 mb-6 text-sm">此操作會將 8 組的分數全部重置為 0，且無法復原。</p>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold transition">取消</button>
                <button onclick="executeReset()" class="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold transition">確定歸零</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ====== Firebase Setup ======
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-tree-app';
        let firebaseConfig = {};
        try { firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {}; } catch(e) {}

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ====== 狀態變數 ======
        const TOTAL_TEAMS = 8;
        const TARGET_SCORE = 60;
        let teamsState = []; // 本地緩存的最新狀態
        let oldScores = Array(TOTAL_TEAMS).fill(-1); // 用於判斷是否觸發特效
        
        let soundEnabled = true;
        let currentViewMode = 'selection'; // selection, projector, controller
        let activeTeamId = null; // 當前手機端控制的隊伍 ID (0-7)
        let unsubscribeSnapshot = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 預設隊伍名稱
        const defaultTeamNames = ['第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組', '第八組'];

        // ====== 初始化與認證 ======
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                setupDatabaseListener();
                initSelectionScreen();
            } catch (error) { console.error("登入失敗:", error); }
        }

        const getDocRef = () => doc(db, 'artifacts', appId, 'public', 'data', 'scores', 'gameData');

        // ====== 資料庫監聽 (核心同步機制) ======
        function setupDatabaseListener() {
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            
            unsubscribeSnapshot = onSnapshot(getDocRef(), (docSnap) => {
                if (docSnap.exists()) {
                    teamsState = docSnap.data().teams;
                    
                    // 檢查分數是否達到 60，觸發音效與煙火
                    teamsState.forEach((team, index) => {
                        const oldScore = oldScores[index];
                        if (oldScore !== -1 && oldScore < TARGET_SCORE && team.score >= TARGET_SCORE) {
                            // 只有在大螢幕模式，或是正在控制該組的手機才放音效跟特效
                            if (currentViewMode === 'projector' || (currentViewMode === 'controller' && activeTeamId === index)) {
                                playSound('victory');
                                fireConfetti();
                                showToast(`🎉 恭喜 [${team.name}] 達成 60 分！`, '🌲');
                            }
                        }
                        oldScores[index] = team.score;
                    });

                    // 依據目前畫面重新渲染
                    if (currentViewMode === 'projector') {
                        renderProjectorView();
                    } else if (currentViewMode === 'controller' && activeTeamId !== null) {
                        renderSingleControllerView();
                    }

                } else {
                    // 若資料庫無資料，初始化
                    const initData = Array(TOTAL_TEAMS).fill(0).map((_, i) => ({ id: i, name: defaultTeamNames[i], score: 0 }));
                    setDoc(getDocRef(), { teams: initData });
                }
            }, (error) => console.error(error));
        }

        // ====== 畫面切換邏輯 ======
        window.switchView = function(mode, teamId = null) {
            currentViewMode = mode;
            document.getElementById('role-selection-view').classList.add('hidden');
            document.getElementById('projector-view').classList.add('hidden');
            document.getElementById('single-controller-view').classList.add('hidden');
            
            const mainHeader = document.getElementById('main-header');
            const mobileHeader = document.getElementById('mobile-header');
            const resetBtn = document.getElementById('reset-btn');

            if (mode === 'projector') {
                mainHeader.classList.remove('hidden');
                mobileHeader.classList.add('hidden');
                resetBtn.classList.remove('hidden'); // 大螢幕模式顯示重置按鈕
                document.getElementById('projector-view').classList.remove('hidden');
                renderProjectorView();
            } else if (mode === 'controller') {
                activeTeamId = teamId;
                mainHeader.classList.add('hidden');
                mobileHeader.classList.remove('hidden');
                document.getElementById('mobile-title').innerText = `📱 第 ${teamId + 1} 組`;
                document.getElementById('single-controller-view').classList.remove('hidden');
                document.getElementById('single-controller-view').classList.add('flex');
                
                // 為了讓音訊在手機端可以順利啟動
                if (audioCtx.state === 'suspended') {
                    // 只需調用一次即可解鎖，我們用空的振盪器來解鎖
                    try {
                        const osc = audioCtx.createOscillator();
                        osc.connect(audioCtx.destination);
                        osc.start(0);
                        osc.stop(0.01);
                    } catch(e){}
                }

                renderSingleControllerView();
            }
        };

        window.backToRoleSelection = function() {
            currentViewMode = 'selection';
            activeTeamId = null;
            document.getElementById('projector-view').classList.add('hidden');
            document.getElementById('single-controller-view').classList.add('hidden');
            document.getElementById('single-controller-view').classList.remove('flex');
            document.getElementById('role-selection-view').classList.remove('hidden');
            
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('mobile-header').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
        };

        function initSelectionScreen() {
            const grid = document.getElementById('team-select-grid');
            grid.innerHTML = '';
            for (let i = 0; i < TOTAL_TEAMS; i++) {
                grid.innerHTML += `
                    <button onclick="switchView('controller', ${i})" class="bg-blue-900/60 hover:bg-blue-600 border border-blue-500/50 text-white rounded-xl py-3 font-bold transition-all hover:scale-105 active:scale-95 text-lg">
                        ${i + 1} 組
                    </button>
                `;
            }
        }

        // ====== 視覺與繪圖邏輯 ======
        function getStageInfo(score) {
            if (score <= 14) {
                return {
                    stage: 1, name: '🌰 種子期',
                    badgeBg: 'bg-amber-900/60 text-amber-300 border-amber-500/30',
                    svg: `
                    <svg viewBox="0 0 100 100" class="w-full h-32 md:h-44 sway-animation">
                        <path d="M10 85 Q50 75 90 85 L90 95 L10 95 Z" fill="#78350f" />
                        <path d="M15 84 Q50 78 85 84" stroke="#a16207" stroke-width="2" fill="none" />
                        <ellipse cx="50" cy="80" rx="12" ry="8" fill="#451a03" transform="rotate(-15 50 80)" stroke="#78350f" stroke-width="2" />
                        <path d="M50 74 Q52 68 54 65" stroke="#84cc16" stroke-width="3" stroke-linecap="round" fill="none" />
                    </svg>`
                };
            } else if (score <= 29) {
                return {
                    stage: 2, name: '🌱 發芽期',
                    badgeBg: 'bg-emerald-900/60 text-emerald-300 border-emerald-500/30',
                    svg: `
                    <svg viewBox="0 0 100 100" class="w-full h-32 md:h-44 sway-animation">
                        <path d="M10 85 Q50 75 90 85 L90 95 L10 95 Z" fill="#78350f" />
                        <path d="M50 85 Q48 65 50 50" stroke="#65a30d" stroke-width="4" stroke-linecap="round" fill="none" />
                        <path d="M50 55 Q35 45 30 50 Q38 62 50 58" fill="#84cc16" />
                        <path d="M50 52 Q65 42 70 47 Q62 59 50 55" fill="#4d7c0f" />
                    </svg>`
                };
            } else if (score <= 44) {
                return {
                    stage: 3, name: '🌿 幼苗期',
                    badgeBg: 'bg-green-900/60 text-green-300 border-green-500/30',
                    svg: `
                    <svg viewBox="0 0 100 100" class="w-full h-32 md:h-44 sway-animation">
                        <path d="M10 85 Q50 75 90 85 L90 95 L10 95 Z" fill="#78350f" />
                        <path d="M50 85 Q47 55 50 35" stroke="#b45309" stroke-width="6" stroke-linecap="round" fill="none" />
                        <circle cx="50" cy="30" r="16" fill="#22c55e" />
                        <circle cx="38" cy="40" r="13" fill="#16a34a" />
                        <circle cx="62" cy="40" r="13" fill="#15803d" />
                        <circle cx="50" cy="24" r="10" fill="#4ade80" />
                    </svg>`
                };
            } else if (score <= 59) {
                return {
                    stage: 4, name: '🌳 成長樹',
                    badgeBg: 'bg-teal-900/60 text-teal-300 border-teal-500/30',
                    svg: `
                    <svg viewBox="0 0 100 100" class="w-full h-32 md:h-44 sway-animation">
                        <path d="M10 85 Q50 75 90 85 L90 95 L10 95 Z" fill="#78350f" />
                        <path d="M50 85 L44 50 Q30 40 25 35 M50 85 L56 50 Q70 40 75 35 M50 85 L50 30" stroke="#92400e" stroke-width="8" stroke-linecap="round" fill="none" />
                        <circle cx="50" cy="25" r="22" fill="#10b981" />
                        <circle cx="32" cy="35" r="18" fill="#059669" />
                        <circle cx="68" cy="35" r="18" fill="#047857" />
                        <circle cx="50" cy="42" r="16" fill="#15803d" />
                        <circle cx="40" cy="25" r="3" fill="#ef4444" />
                        <circle cx="60" cy="28" r="3" fill="#ef4444" />
                        <circle cx="50" cy="38" r="3" fill="#ef4444" />
                    </svg>`
                };
            } else {
                return {
                    stage: 5, name: '🌲 參天大樹',
                    badgeBg: 'bg-yellow-500/20 text-yellow-300 border-yellow-400/50 shadow-lg',
                    svg: `
                    <svg viewBox="0 0 100 100" class="w-full h-32 md:h-44 giant-glow">
                        <defs>
                            <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <path d="M5 88 Q50 78 95 88 L95 95 L5 95 Z" fill="#78350f" />
                        <path d="M50 90 L42 45 Q20 30 12 20 M50 90 L58 45 Q80 30 88 20 M50 90 L50 20" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none" />
                        <circle cx="50" cy="20" r="26" fill="#15803d" filter="url(#gold-glow)" />
                        <circle cx="26" cy="32" r="22" fill="#166534" />
                        <circle cx="74" cy="32" r="22" fill="#14532d" />
                        <circle cx="50" cy="38" r="20" fill="#22c55e" />
                        <circle cx="50" cy="14" r="18" fill="#4ade80" />
                        <path d="M42 0 L46 6 L50 0 L54 6 L58 0 L56 10 L44 10 Z" fill="#facc15" />
                        <circle cx="20" cy="15" r="2" fill="#fde047" class="animate-ping" />
                        <circle cx="80" cy="18" r="2" fill="#fde047" class="animate-ping" />
                        <circle cx="50" cy="5" r="2.5" fill="#fde047" class="animate-ping" />
                    </svg>`
                };
            }
        }

        // ====== 渲染大螢幕模式 ======
        function renderProjectorView() {
            if (teamsState.length === 0) return;
            const grid = document.getElementById('projector-grid');
            grid.innerHTML = '';

            const sorted = [...teamsState].sort((a,b) => b.score - a.score);

            teamsState.forEach((team) => {
                const stageInfo = getStageInfo(team.score);
                const progressPercent = Math.min(100, Math.max(0, (team.score / TARGET_SCORE) * 100));

                let rankText = '';
                if (team.score > 0) {
                    const rankIndex = sorted.findIndex(t => t.id === team.id);
                    if (rankIndex === 0) rankText = '🥇 第 1 名';
                    else if (rankIndex === 1) rankText = '🥈 第 2 名';
                    else if (rankIndex === 2) rankText = '🥉 第 3 名';
                }

                const cardHtml = `
                    <div class="relative bg-slate-900/70 border ${team.score >= TARGET_SCORE ? 'border-yellow-400 bg-yellow-950/20 bg-glow' : 'border-slate-800'} rounded-2xl p-3 flex flex-col justify-between items-center transition-all duration-500 backdrop-blur-md h-full">
                        
                        ${rankText ? `<div class="absolute -top-3 left-1/2 transform -translate-x-1/2 px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 font-black text-xs shadow-md whitespace-nowrap z-10">${rankText}</div>` : ''}

                        <div class="text-center w-full mt-1">
                            <h3 class="font-extrabold text-base md:text-lg text-slate-100 truncate">${team.name}</h3>
                            <span class="inline-block mt-1 px-2 py-0.5 text-xs font-semibold rounded-full border ${stageInfo.badgeBg}">
                                ${stageInfo.name}
                            </span>
                        </div>

                        <div class="w-full my-2 flex items-end justify-center relative flex-1 min-h-[140px] md:min-h-[180px]">
                            ${stageInfo.svg}
                        </div>

                        <div class="w-full">
                            <div class="flex justify-between items-baseline mb-1 text-xs">
                                <span class="text-slate-400 font-medium">得分</span>
                                <span class="font-extrabold text-lg ${team.score >= TARGET_SCORE ? 'text-yellow-400 font-black text-xl animate-pulse' : 'text-emerald-400'}">
                                    ${team.score} <span class="text-xs text-slate-400 font-normal">/ 60</span>
                                </span>
                            </div>
                            <div class="w-full h-3 bg-slate-950 rounded-full overflow-hidden border border-slate-800 p-0.5">
                                <div class="h-full rounded-full transition-all duration-700 ease-out ${team.score >= TARGET_SCORE ? 'bg-gradient-to-r from-yellow-500 to-amber-300' : 'bg-gradient-to-r from-emerald-500 to-teal-300'}" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // ====== 渲染單一手機遙控器模式 ======
        function renderSingleControllerView() {
            if (activeTeamId === null || teamsState.length === 0) return;
            const container = document.getElementById('mobile-team-display');
            const team = teamsState[activeTeamId];
            if (!team) return;

            const stageInfo = getStageInfo(team.score);
            const progressPercent = Math.min(100, Math.max(0, (team.score / TARGET_SCORE) * 100));

            container.innerHTML = `
                <div class="bg-slate-900/90 border ${team.score >= TARGET_SCORE ? 'border-yellow-400 bg-glow' : 'border-slate-800'} rounded-3xl p-6 shadow-2xl w-full">
                    
                    <!-- SVG Display (Larger for mobile) -->
                    <div class="w-full flex items-end justify-center relative min-h-[200px] mb-6">
                        ${stageInfo.svg}
                    </div>

                    <!-- Status Info -->
                    <div class="text-center mb-6">
                        <span class="inline-block mb-2 px-3 py-1 text-sm font-bold rounded-full border ${stageInfo.badgeBg}">
                            ${stageInfo.name}
                        </span>
                        <div class="text-6xl font-black ${team.score >= TARGET_SCORE ? 'text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)]' : 'text-emerald-400'} tracking-tighter my-2 transition-colors">
                            ${team.score}
                        </div>
                        <div class="w-full h-4 bg-slate-950 rounded-full overflow-hidden border border-slate-700 p-0.5 max-w-[80%] mx-auto">
                            <div class="h-full rounded-full transition-all duration-500 ${team.score >= TARGET_SCORE ? 'bg-gradient-to-r from-yellow-500 to-amber-300' : 'bg-gradient-to-r from-emerald-500 to-teal-300'}" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="changeScore(${team.id}, 1)" class="py-6 rounded-2xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 border-b-4 border-emerald-800 text-white font-black text-3xl transition-all active:scale-95 shadow-lg flex flex-col items-center justify-center leading-none">
                            +1 分
                        </button>
                        <button onclick="changeScore(${team.id}, 2)" class="py-6 rounded-2xl bg-teal-600 hover:bg-teal-500 active:bg-teal-700 border-b-4 border-teal-800 text-white font-black text-3xl transition-all active:scale-95 shadow-lg flex flex-col items-center justify-center leading-none">
                            +2 分
                        </button>
                        <button onclick="changeScore(${team.id}, -1)" class="col-span-2 py-4 rounded-2xl bg-rose-900/40 hover:bg-rose-800/60 border-2 border-rose-700/50 text-rose-300 font-black text-2xl transition-all active:scale-95 shadow-inner">
                            -1 分
                        </button>
                    </div>

                </div>
            `;
        }

        // ====== 分數操作與寫入資料庫 ======
        window.changeScore = async function(teamId, delta) {
            if (!auth.currentUser || teamsState.length === 0) return;
            
            // 樂觀更新 UI 以求流暢
            const teamIndex = teamsState.findIndex(t => t.id === teamId);
            if (teamIndex !== -1) {
                const team = teamsState[teamIndex];
                const oldScore = team.score;
                team.score = Math.max(0, team.score + delta);
                
                // 立即在本地播放音效 (由發起端播放)
                if (delta > 0) playSound('up');
                else if (delta < 0) playSound('down');

                if (currentViewMode === 'controller') renderSingleControllerView();
            }

            try {
                // 寫入遠端資料庫
                const docSnap = await getDoc(getDocRef());
                if (docSnap.exists()) {
                    const currentData = docSnap.data().teams;
                    const dbTeamIndex = currentData.findIndex(t => t.id === teamId);
                    
                    if(dbTeamIndex !== -1) {
                        let finalScore = currentData[dbTeamIndex].score + delta;
                        finalScore = Math.max(0, finalScore);
                        currentData[dbTeamIndex].score = finalScore;
                        await setDoc(getDocRef(), { teams: currentData }, { merge: true });
                    }
                }
            } catch (error) { console.error("Update score failed:", error); }
        };

        // ====== 重置功能 ======
        window.showResetModal = () => document.getElementById('reset-confirm-modal').classList.remove('hidden');
        window.closeResetModal = () => document.getElementById('reset-confirm-modal').classList.add('hidden');
        window.executeReset = async () => {
            if (!auth.currentUser) return;
            try {
                const resetData = Array(TOTAL_TEAMS).fill(0).map((_, i) => ({ id: i, name: defaultTeamNames[i], score: 0 }));
                await setDoc(getDocRef(), { teams: resetData });
                closeResetModal();
                showToast('所有組別分數已重置！', '🔄');
            } catch (error) { console.error(error); }
        }

        // ====== 輔助功能 ======
        window.toggleAudio = function() {
            soundEnabled = !soundEnabled;
            document.getElementById('audio-btn').innerText = soundEnabled ? '🔊 音效: 開' : '🔇 音效: 關';
        };

        function showToast(msg, icon = '✨') {
            const toast = document.getElementById('toast-modal');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'up') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now); osc.stop(now + 0.35);
                } else if (type === 'down') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'victory') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const subOsc = audioCtx.createOscillator();
                        const subGain = audioCtx.createGain();
                        subOsc.connect(subGain); subGain.connect(audioCtx.destination);
                        subOsc.type = 'triangle';
                        subOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        subGain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        subGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                        subOsc.start(now + idx * 0.1); subOsc.stop(now + idx * 0.1 + 0.3);
                    });
                }
            } catch(e) {}
        }

        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, zIndex: 1000 });
            }
        }

        window.onload = function() {
            initAuth();
        };
    </script>
</body>
</html>
